[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "trivikrama"
version = "0.1.0"
description = "Run full-size transformer encoders on microcontrollers by streaming weights from an SD card."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Vadhyar Sai Charan" }]
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]
keywords = ["tinyml", "microcontroller", "transformer", "bert", "esp32", "rp2040"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Embedded Systems",
]

[project.optional-dependencies]
convert = ["safetensors>=0.4"]

[project.scripts]
trivi = "trivikrama.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
