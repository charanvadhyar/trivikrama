name: tests

on:
  push:
  pull_request:

jobs:
  core:
    name: C core + features (NumPy reference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - run: make test-kernels
      - run: make test-features

  huggingface:
    name: ModernBERT vs Hugging Face
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy transformers
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: make test-modernbert
